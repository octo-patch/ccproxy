ccproxy:
  auth:
    command_timeout_seconds: 5
    refresh_headroom_seconds: 60
    refresh_timeout_seconds: 15
  gemini_capacity:
    enabled: true
    fallback_models:
    - gemini-3-flash-preview
    - gemini-2.5-pro
    - gemini-2.5-flash
    retry_status_codes:
    - 429
    - 503
    - 500
    sticky_retry_attempts: 3
    sticky_retry_max_delay_seconds: 60
    terminal_delay_threshold_seconds: 300
    total_retry_budget_seconds: 120
  hooks:
    inbound:
    - ccproxy.hooks.inject_auth
    - ccproxy.hooks.extract_session_id
    - ccproxy.hooks.extract_pplx_files
    - ccproxy.hooks.pplx_thread_inject
    outbound:
    - ccproxy.hooks.gemini_cli
    - ccproxy.hooks.pplx_stamp_headers
    - ccproxy.hooks.pplx_preflight
    - ccproxy.hooks.inject_mcp_notifications
    - ccproxy.hooks.verbose_mode
    - ccproxy.hooks.commitbee_compat
    - ccproxy.hooks.shape
  host: 127.0.0.1
  inspector:
    cert_dir: ~/.config/ccproxy
    port: 8083
    transforms: []
  log_level: INFO
  mcp:
    buffer:
      max_events_per_task: 65536
      ttl_seconds: 600
    http:
      auth: null
      enabled: true
      host: 127.0.0.1
      port: 4030
  otel:
    enabled: false
    endpoint: http://localhost:4317
    service_name: ccproxy
  port: 4000
  pplx:
    search:
      always_search_override: false
      is_incognito: false
      is_nav_suggestions_disabled: true
      language: en-US
      override_no_search: false
      preflight_timeout_seconds: 5
      search_focus: internet
      search_recency_filter: null
      skip_search_enabled: true
      sources:
      - web
      timezone: America/Los_Angeles
    thread:
      citation_mode: markdown
      consistency_mode: warn
      fetch_page_size: 100
      fetch_timeout_seconds: 10
      ttl_seconds: 1800
    upload:
      fetch_timeout_seconds: 10
      max_file_size_bytes: 52428800
      max_files: 30
      subscribe_timeout_seconds: 120
      upload_timeout_seconds: 60
  providers:
    anthropic:
      auth:
        command: printenv CLAUDE_CODE_OAUTH_TOKEN
        type: command
      host: api.anthropic.com
      path: /v1/messages
      type: anthropic
    codex:
      auth:
        command: jq -r '.tokens.access_token' ~/.codex/auth.json
        type: command
      host: chatgpt.com
      path: /backend-api/codex/responses
      type: openai_responses
    deepseek:
      auth:
        command: printenv DEEPSEEK_API_KEY
        header: x-api-key
        type: command
      host: api.deepseek.com
      path: /anthropic/v1/messages
      type: anthropic
    gemini:
      auth:
        client_id: 681255809395-oo8ft2oprdrnp9e3aqf6av3hmdib135j.apps.googleusercontent.com
        client_secret: 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
        type: google_oauth
      host: cloudcode-pa.googleapis.com
      path: /v1internal:{action}
      type: gemini
    perplexity_pro:
      auth:
        file: ~/.opnix/secrets/perplexity-pro-api-key
        type: file
      fingerprint_profile: chrome131
      host: www.perplexity.ai
      path: /rest/sse/perplexity_ask
      type: perplexity_pro
  shaping:
    enabled: true
    providers:
      anthropic:
        capture:
          path_pattern: ^/v1/messages
        content_fields:
        - model
        - messages
        - tools
        - tool_choice
        - system
        - thinking
        - context_management
        - stream
        - max_tokens
        - temperature
        - top_p
        - top_k
        - stop_sequences
        - diagnostics
        - metadata
        merge_strategies:
          system: prepend_shape:2
        preserve_headers:
        - authorization
        - x-api-key
        - x-goog-api-key
        - host
        shape_hooks:
        - ccproxy.shaping.regenerate
        - hook: ccproxy.shaping.caching.strip
          params:
            paths:
            - system.*.cache_control
        - hook: ccproxy.shaping.caching.insert
          params:
            path: system.-1.cache_control
            value:
              type: ephemeral
        strip_headers:
        - authorization
        - x-api-key
        - x-goog-api-key
        - content-length
        - host
        - transfer-encoding
        - connection
        - accept-encoding
      gemini:
        capture:
          path_pattern: '^/v1internal:'
        content_fields:
        - model
        - project
        - user_prompt_id
        preserve_headers:
        - authorization
        - host
        shape_hooks:
        - ccproxy.shaping.regenerate
        - ccproxy.shaping.gemini
        strip_headers:
        - authorization
        - content-length
        - host
        - transfer-encoding
        - connection
        - accept-encoding
      openai_responses:
        capture:
          path_pattern: ^/(v1/|backend-api/codex/)?responses
        content_fields: []
        preserve_headers:
        - authorization
        - host
        shape_hooks:
        - ccproxy.shaping.regenerate
        - ccproxy.shaping.responses
        strip_headers:
        - authorization
        - cookie
        - chatgpt-account-id
        - x-codex-turn-metadata
        - x-codex-window-id
        - session-id
        - thread-id
        - content-length
        - host
        - transfer-encoding
        - connection
        - accept-encoding
    shapes_dir: ~/.config/ccproxy/shapes
